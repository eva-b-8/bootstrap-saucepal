<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Patrick+Hand&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>Bootstrap - My Fridge - Saucepal</title>
    <link rel="icon" type="image/x-icon" href="images/saucepal-favicon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="index.html"
        ><img src="images/saucepal-logo.svg" width="150" height="50" alt=""
      /></a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="fridge.html">My Fridge</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container" id="my-form">
      <h1>Hello!</h1>
      <br />
      <h2>Let us know what you have in your fridge.</h2>
      <p>We will try to match your ingredients with recipes.</p>
      <form class="form-row">
        <label class="sr-only" for="inlineFormInputName2"
          >Ingredient name</label
        >
        <input
          type="text"
          class="form-control mb-2 mr-sm-2"
          id="inlineFormInputName2"
          placeholder="Tomatoes"
        />

        <label class="sr-only" for="inlineFormInputGroupUsername2"
          >Quantity (kg)</label
        >
        <div class="input-group mb-2 mr-sm-2">
          <input
            type="number"
            class="form-control"
            name="quantity"
            step="0.1"
            placeholder="0.5"
            id="inlineFormInputGroupUsername2"
          />
        </div>

        <div class="form-group">
          <label for="exampleFormControlSelect1">Category</label>
          <select class="form-control" id="exampleFormControlSelect1">
            <option value="Other">Choose one</option>
            <option value="Fruit & veg">Fruit &amp; veg</option>
            <option value="Meat & fish">Meat &amp; fish</option>
            <option value="Dairy & eggs">Dairy &amp; eggs</option>
            <option value="Store cupboard">Store cupboard</option>
            <option value="Frozen">Frozen</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <br />
        <button type="submit" class="btn btn-primary mb-2">Submit</button>
      </form>
    </div>

    <script>
      const form = document.querySelector("#my-form form");
      const nameInput = document.getElementById("inlineFormInputName2");
      const qtyInput = document.getElementById("inlineFormInputGroupUsername2");
      const categorySelect = document.getElementById(
        "exampleFormControlSelect1",
      );

      form.noValidate = true;

      const list = document.createElement("ul");
      list.className = "list-group mt-3";
      list.setAttribute("aria-label", "Ingredients in your fridge");
      form.after(list);

      function addError(field, afterEl) {
        const msg = document.createElement("div");
        msg.id = field.id + "-error";
        msg.className = "invalid-feedback d-block";
        msg.hidden = true;
        afterEl.after(msg);
        field.setAttribute("aria-describedby", msg.id);
        return msg;
      }

      const errors = {
        name: addError(nameInput, nameInput),
        qty: addError(qtyInput, qtyInput.parentElement),
        category: addError(categorySelect, categorySelect),
      };

      function showError(field, msgEl, message) {
        field.classList.add("is-invalid");
        field.setAttribute("aria-invalid", "true");
        msgEl.textContent = message;
        msgEl.hidden = false;
      }

      function clearError(field, msgEl) {
        field.classList.remove("is-invalid");
        field.removeAttribute("aria-invalid");
        msgEl.hidden = true;
      }

      function validate() {
        let firstInvalid = null;

        const name = nameInput.value.trim();
        if (!name) {
          showError(nameInput, errors.name, "Enter an ingredient name.");
          firstInvalid ??= nameInput;
        } else {
          clearError(nameInput, errors.name);
        }

        const qty = parseFloat(qtyInput.value);
        if (qtyInput.value === "") {
          showError(qtyInput, errors.qty, "Enter a quantity in kg.");
          firstInvalid ??= qtyInput;
        } else if (!(qty > 0)) {
          showError(qtyInput, errors.qty, "Enter a quantity above 0 kg.");
          firstInvalid ??= qtyInput;
        } else {
          clearError(qtyInput, errors.qty);
        }

        if (categorySelect.selectedIndex === 0) {
          showError(categorySelect, errors.category, "Choose a category.");
          firstInvalid ??= categorySelect;
        } else {
          clearError(categorySelect, errors.category);
        }

        if (firstInvalid) firstInvalid.focus();
        return !firstInvalid;
      }

      nameInput.addEventListener("input", () => {
        if (nameInput.value.trim()) clearError(nameInput, errors.name);
      });
      qtyInput.addEventListener("input", () => {
        if (parseFloat(qtyInput.value) > 0) clearError(qtyInput, errors.qty);
      });
      categorySelect.addEventListener("change", () => {
        if (categorySelect.selectedIndex !== 0)
          clearError(categorySelect, errors.category);
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!validate()) return;

        const name = nameInput.value.trim();
        const qty = parseFloat(qtyInput.value);
        const category = categorySelect.value;

        const li = document.createElement("li");
        li.className =
          "list-group-item d-flex justify-content-between align-items-center";

        const text = document.createElement("span");
        text.textContent = `${name} – ${qty} kg (${category})`;

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "btn btn-sm btn-outline-danger";
        remove.textContent = "Remove";
        remove.setAttribute("aria-label", `Remove ${name}`);
        remove.addEventListener("click", () => li.remove());

        li.append(text, remove);
        list.append(li);

        form.reset();
        nameInput.focus();
      });
    </script>
  </body>
</html>
