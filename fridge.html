<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Patrick+Hand&family=Quicksand:wght@300..700&display=swap"
      rel="stylesheet"
    />

    <title>Bootstrap - My Fridge - Saucepal</title>
    <link rel="icon" type="image/x-icon" href="images/saucepal-favicon.png" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="index.html"
        ><img src="images/saucepal-logo.svg" width="150" height="50" alt=""
      /></a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav mr-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item active">
            <a class="nav-link" href="fridge.html">My Fridge</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="container" id="my-form">
      <h1>Hello!</h1>
      <br />
      <h2>Let us know what you have in your fridge.</h2>
      <p>We will try to match your ingredients with recipes.</p>
      <form class="needs-validation" novalidate>
        <div class="row g-2 align-items-end">
          <div class="col-md-3">
            <label class="form-label" for="inlineFormInputName2"
              >Ingredient name</label
            >
            <input
              type="text"
              class="form-control"
              id="inlineFormInputName2"
              placeholder="Tomatoes"
              aria-describedby="inlineFormInputName2Feedback"
              required
            />
            <div id="inlineFormInputName2Feedback" class="invalid-feedback">
              Enter an ingredient name.
            </div>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="inlineFormInputGroupUsername2"
              >Quantity (kg)</label
            >
            <div class="input-group has-validation">
              <input
                type="number"
                class="form-control"
                name="quantity"
                step="0.1"
                placeholder="0.5"
                id="inlineFormInputGroupUsername2"
                aria-describedby="inlineFormInputGroupUsername2Feedback"
              />
              <div
                id="inlineFormInputGroupUsername2Feedback"
                class="invalid-feedback"
              >
                Enter a quantity.
              </div>
            </div>
          </div>

          <div class="col-md-3">
            <label class="form-label" for="exampleFormControlSelect1"
              >Category</label
            >
            <select
              class="form-select"
              id="exampleFormControlSelect1"
              aria-describedby="exampleFormControlSelect1Feedback"
            >
              <option value="Other" selected>Choose one</option>
              <option value="Fruit & veg">Fruit &amp; veg</option>
              <option value="Meat & fish">Meat &amp; fish</option>
              <option value="Dairy & eggs">Dairy &amp; eggs</option>
              <option value="Store cupboard">Store cupboard</option>
              <option value="Frozen">Frozen</option>
              <option value="Other">Other</option>
            </select>
            <div
              id="exampleFormControlSelect1Feedback"
              class="invalid-feedback"
            >
              Choose a category.
            </div>
          </div>

          <div class="col-md-3">
            <button type="submit" class="btn btn-primary">Submit</button>
          </div>
        </div>
      </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
